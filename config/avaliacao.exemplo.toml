# EXEMPLO ILUSTRATIVO.
# O conteudo abaixo (disciplina, questoes, valores) foi inventado apenas para mostrar
# o formato. Nao e ementa, nao e plano de curso, nao e prova real.
#
# Copie para config/avaliacao.toml e substitua tudo pelo seu.
#
# Regra: o maximo da questao tem que ser igual a soma dos maximos dos criterios.

[avaliacao]
disciplina = "Nome da disciplina"
titulo = "Nome da atividade"
data = "AAAA-MM-DD"
# Modelo e servidor: escolha ainda em aberto (ver README, "O que ainda nao esta decidido").
modelo = "qwen3-vl:8b"
servidor = "http://oraculo:30068"
rodadas = 3                      # correcoes independentes por folha

[[questoes]]
id = "Q1"
enunciado = "Determine a equacao geral do plano que passa por A(1,0,2), B(2,1,1) e C(0,2,3)."
max = 4.0
criterios = [
  { nome = "montou os vetores diretores AB e AC", max = 1.0 },
  { nome = "calculou o produto vetorial (vetor normal)", max = 2.0 },
  { nome = "escreveu a equacao geral do plano corretamente", max = 1.0 },
]

[[questoes]]
id = "Q2"
enunciado = "Calcule a area do triangulo de vertices A, B e C."
max = 3.0
criterios = [
  { nome = "usou area = |AB x AC| / 2", max = 1.0 },
  { nome = "valor numerico correto", max = 2.0 },
]

[[questoes]]
id = "Q3"
enunciado = "Explique por que o produto vetorial de dois vetores paralelos e o vetor nulo."
max = 3.0
criterios = [
  { nome = "relacionou paralelismo com dependencia linear ou angulo 0/180", max = 1.5 },
  { nome = "usou |u x v| = |u||v| sen(theta) e concluiu sen = 0", max = 1.0 },
  { nome = "justificativa coerente e sem contradicao", max = 0.5 },
]
