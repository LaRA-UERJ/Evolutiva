# EXEMPLO ILUSTRATIVO.
# O conteudo abaixo (disciplina, questoes, valores) foi inventado apenas para mostrar
# o formato. Nao e ementa, nao e plano de curso, nao e prova real.
#
# Copie para config/avaliacao.toml e substitua tudo pelo seu.
#
# Estrutura: a prova tem QUESTOES, cada questao tem ITENS, e a correcao acontece por ITEM.
#   maximo do item   = soma dos maximos dos criterios daquele item
#   maximo da questao = soma dos maximos dos itens

[avaliacao]
disciplina = "Nome da disciplina"
titulo = "Nome da atividade"
data = "AAAA-MM-DD"
# Modelo e servidor: escolha ainda em aberto (ver README, "O que ainda nao esta decidido").
modelo = "qwen3-vl:8b"
servidor = "http://oraculo:30068"
rodadas = 3                      # correcoes independentes por folha

# A prova real tem quatro questoes. Aqui ficam duas, so para mostrar o formato.

[[questoes]]
id = "Q1"
enunciado = "enunciado da questao 1"

  [[questoes.itens]]
  id = "Q1a"
  enunciado = "enunciado do item a"
  max = 2.0
  criterios = [
    { nome = "primeiro passo esperado", max = 1.0 },
    { nome = "resultado do item", max = 1.0 },
  ]

  [[questoes.itens]]
  id = "Q1b"
  enunciado = "enunciado do item b, que depende do item a"
  max = 2.0
  criterios = [
    { nome = "usou o resultado do item a", max = 0.5 },
    { nome = "metodo correto", max = 1.0 },
    { nome = "resultado do item", max = 0.5 },
  ]

[[questoes]]
id = "Q2"
enunciado = "enunciado da questao 2"

  [[questoes.itens]]
  id = "Q2a"
  enunciado = "item discursivo, sem conta"
  max = 3.0
  criterios = [
    { nome = "mecanismo nomeado corretamente", max = 1.5 },
    { nome = "justificativa coerente e sem contradicao", max = 1.5 },
  ]
